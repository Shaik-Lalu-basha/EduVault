services:
  - type: web
    name: eduvault-backend
    env: python
    plan: free
    pythonVersion: 3.10
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn -w 4 -b 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: DATABASE_URL
        scope: project
      - key: SECRET_KEY
        scope: project
        generateValue: true
      - key: JWT_SECRET_KEY
        scope: project
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000

  - type: static_site
    name: eduvault-frontend
    staticPublishPath: frontend
    buildCommand: echo "Frontend is ready"
    routes:
      - path: /
        destination: index.html
      - path: /about
        destination: about.html
      - path: /contact
        destination: contact.html
      - path: /viewer
        destination: viewer.html
