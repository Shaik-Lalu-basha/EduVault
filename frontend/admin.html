<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - EduVault</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/glassmorphism.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .admin-header {
            margin-bottom: 30px;
            text-align: center;
        }

        .admin-header h1 {
            color: var(--accent-primary);
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .admin-nav {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .admin-nav .btn {
            cursor: pointer;
        }

        .admin-section {
            display: none;
        }

        .admin-section.active {
            display: block;
            animation: slideUp 0.3s ease;
        }

        .upload-form {
            background: linear-gradient(135deg, rgba(10, 10, 25, 0.6), rgba(26, 26, 46, 0.6));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent-primary);
            font-weight: 600;
            font-size: 0.95em;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: rgba(0, 212, 255, 0.1);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 20px;
            background: rgba(0, 212, 255, 0.1);
            border: 2px dashed rgba(0, 212, 255, 0.5);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--accent-primary);
        }

        .file-input-label:hover {
            background: rgba(0, 212, 255, 0.2);
            border-color: var(--accent-primary);
        }

        .file-input-label i {
            display: block;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .file-name {
            color: #90EE90;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .upload-btn {
            grid-column: 1 / -1;
        }

        .documents-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(26, 26, 46, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .documents-table thead {
            background: rgba(0, 212, 255, 0.15);
            border-bottom: 2px solid rgba(0, 212, 255, 0.3);
        }

        .documents-table th {
            padding: 15px;
            text-align: left;
            color: var(--accent-primary);
            font-weight: 600;
        }

        .documents-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
            color: #ccc;
        }

        .documents-table tr:hover {
            background: rgba(0, 212, 255, 0.1);
        }

        .doc-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            background: rgba(0, 212, 255, 0.2);
            color: var(--accent-primary);
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
        }

        .status-published {
            background: rgba(144, 238, 144, 0.2);
            color: #90EE90;
        }

        .status-draft {
            background: rgba(255, 165, 0, 0.2);
            color: #FFa500;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--accent-primary);
            cursor: pointer;
            margin: 0 5px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            color: #FFa500;
            transform: scale(1.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(163, 0, 212, 0.1));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card .stat-number {
            font-size: 2.5em;
            color: var(--accent-primary);
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-card .stat-label {
            color: #aaa;
            font-size: 0.9em;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid rgba(0, 212, 255, 0.2);
            border-top: 4px solid var(--accent-primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .message {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: rgba(144, 238, 144, 0.2);
            color: #90EE90;
            border: 1px solid rgba(144, 238, 144, 0.5);
            display: block;
        }

        .message.error {
            background: rgba(255, 99, 71, 0.2);
            color: #FF6347;
            border: 1px solid rgba(255, 99, 71, 0.5);
            display: block;
        }

        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        @media (max-width: 768px) {
            .admin-nav {
                flex-direction: column;
            }

            .admin-nav .btn {
                width: 100%;
            }

            .documents-table {
                font-size: 0.9em;
            }

            .documents-table th,
            .documents-table td {
                padding: 10px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-vault"></i>
                <span>EduVault Admin</span>
            </div>
            <button class="btn btn-secondary logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <h1>Admin Dashboard</h1>
            <p id="admin-welcome">Welcome, Admin!</p>
        </div>

        <div class="admin-nav">
            <button class="btn btn-primary" onclick="switchTab('upload')">
                <i class="fas fa-cloud-upload-alt"></i> Upload PDF
            </button>
            <button class="btn btn-secondary" onclick="switchTab('manage')">
                <i class="fas fa-list"></i> Manage Documents
            </button>
            <button class="btn btn-secondary" onclick="switchTab('stats')">
                <i class="fas fa-chart-bar"></i> Statistics
            </button>
        </div>

        <!-- Upload Section -->
        <div id="upload" class="admin-section active">
            <h2 style="color: var(--accent-primary); margin: 30px 0 20px;">Upload PDF Document</h2>

            <div id="uploadMessage" class="message"></div>

            <form class="upload-form" id="uploadForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="title">Document Title *</label>
                        <input type="text" id="title" name="title" placeholder="e.g., Data Structures Lab Manual"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="branch">Branch *</label>
                        <select id="branch" name="branch" required>
                            <option value="">Select Branch</option>
                            <option value="CSE">Computer Science (CSE)</option>
                            <option value="ECE">Electronics (ECE)</option>
                            <option value="Mechanical">Mechanical Engineering</option>
                            <option value="Civil">Civil Engineering</option>
                            <option value="Electrical">Electrical Engineering</option>
                            <option value="EEE">EEE</option>
                            <option value="Biomedical">Biomedical</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="semester">Semester *</label>
                        <select id="semester" name="semester" required>
                            <option value="">Select Semester</option>
                            <option value="1">1st Semester</option>
                            <option value="2">2nd Semester</option>
                            <option value="3">3rd Semester</option>
                            <option value="4">4th Semester</option>
                            <option value="5">5th Semester</option>
                            <option value="6">6th Semester</option>
                            <option value="7">7th Semester</option>
                            <option value="8">8th Semester</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject *</label>
                        <input type="text" id="subject" name="subject" placeholder="e.g., Data Structures" required>
                    </div>

                    <div class="form-group">
                        <label for="type">Document Type *</label>
                        <select id="type" name="type" required>
                            <option value="">Select Type</option>
                            <option value="PDF">PDF Notes</option>
                            <option value="Lab Manual">Lab Manual</option>
                            <option value="Exam Paper">Exam Paper</option>
                            <option value="Assignment">Assignment</option>
                            <option value="Textbook">Textbook</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description"
                        placeholder="Brief description of the document..."></textarea>
                </div>

                <div class="form-group">
                    <label>Upload PDF File *</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="pdfFile" name="pdfFile" accept=".pdf" required>
                        <label for="pdfFile" class="file-input-label">
                            <i class="fas fa-file-pdf"></i>
                            <span>Click to select PDF or drag and drop</span>
                            <div id="fileName" class="file-name"></div>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="publish" name="publish" checked
                            style="width: auto; margin-right: 10px;">
                        Publish immediately
                    </label>
                </div>

                <div class="loading-spinner" id="uploadSpinner">
                    <div class="spinner"></div>
                    <p>Uploading... Please wait</p>
                </div>

                <button type="submit" class="btn btn-primary upload-btn" id="uploadBtn">
                    <i class="fas fa-upload"></i> Upload Document
                </button>
            </form>
        </div>

        <!-- Manage Section -->
        <div id="manage" class="admin-section">
            <h2 style="color: var(--accent-primary); margin: 30px 0 20px;">Manage Documents</h2>

            <div id="managedocs"></div>

            <div class="loading-spinner" style="display: block;">
                <div class="spinner"></div>
                <p>Loading documents...</p>
            </div>
        </div>

        <!-- Statistics Section -->
        <div id="stats" class="admin-section">
            <h2 style="color: var(--accent-primary); margin: 30px 0 20px;">Platform Statistics</h2>

            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-label">Total Documents</div>
                    <div class="stat-number" id="statDocs">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Views</div>
                    <div class="stat-number" id="statViews">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Users</div>
                    <div class="stat-number" id="statUsers">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Active Users</div>
                    <div class="stat-number" id="statActive">0</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>

</html>
