<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduVault</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/glassmorphism.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 50%, #16213e 100%);
            position: relative;
            overflow: hidden;
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: linear-gradient(135deg, rgba(10, 10, 25, 0.7), rgba(26, 26, 46, 0.7));
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.1);
            animation: slideUp 0.6s ease;
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-logo {
            font-size: 3em;
            color: var(--accent-primary);
            margin-bottom: 15px;
            animation: slideUp 0.6s ease 0.1s both;
        }

        .login-title {
            font-size: 2em;
            color: #fff;
            margin-bottom: 10px;
            font-weight: 700;
            animation: slideUp 0.6s ease 0.2s both;
        }

        .login-subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95em;
            animation: slideUp 0.6s ease 0.3s both;
        }

        .form-group {
            margin-bottom: 25px;
            animation: slideUp 0.6s ease 0.4s both;
        }

        .form-group:nth-child(2) {
            animation-delay: 0.5s;
        }

        .form-group:nth-child(3) {
            animation-delay: 0.6s;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: var(--accent-primary);
            font-weight: 600;
            font-size: 0.95em;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            color: #fff;
            font-family: inherit;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-group input:focus {
            outline: none;
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .form-group input:valid {
            border-color: #90EE90;
        }

        .form-group input:invalid {
            border-color: #FF6347;
        }

        .remember-forget {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 0.9em;
            animation: slideUp 0.6s ease 0.7s both;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.7);
        }

        .remember-me input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .forgot-password {
            color: var(--accent-primary);
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .forgot-password:hover {
            color: var(--accent-secondary);
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 10px;
            color: #0f0f1e;
            font-size: 1.05em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: slideUp 0.6s ease 0.8s both;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s ease;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .login-divider {
            text-align: center;
            margin: 30px 0;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9em;
            animation: slideUp 0.6s ease 0.9s both;
        }

        .signup-link {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            animation: slideUp 0.6s ease 1s both;
        }

        .signup-link a {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .signup-link a:hover {
            color: var(--accent-secondary);
            text-decoration: underline;
        }

        .admin-badge {
            display: inline-block;
            padding: 6px 12px;
            background: rgba(163, 0, 212, 0.3);
            border: 1px solid var(--accent-secondary);
            color: var(--accent-secondary);
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 600;
            margin-left: 10px;
        }

        .message {
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            animation: slideDown 0.3s ease;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: rgba(144, 238, 144, 0.2);
            color: #90EE90;
            border: 1px solid rgba(144, 238, 144, 0.5);
        }

        .message.error {
            background: rgba(255, 99, 71, 0.2);
            color: #FF6347;
            border: 1px solid rgba(255, 99, 71, 0.5);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-spinner {
            display: none;
            text-align: center;
            margin-bottom: 15px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 212, 255, 0.2);
            border-top: 3px solid var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .back-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--accent-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            z-index: 20;
        }

        .back-home:hover {
            gap: 12px;
            color: var(--accent-secondary);
        }

        .back-home i {
            font-size: 1.2em;
        }

        /* Particles background */
        #particles-js {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 40px 25px;
            }

            .login-title {
                font-size: 1.6em;
            }

            .login-logo {
                font-size: 2.5em;
            }

            .form-group input {
                padding: 12px 14px;
                font-size: 1em;
            }

            .remember-forget {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }

            .back-home {
                top: 15px;
                left: 15px;
                font-size: 0.9em;
            }
        }
    </style>
</head>

<body>
    <div id="particles-js"></div>

    <a href="index.html" class="back-home">
        <i class="fas fa-arrow-left"></i>
        Back to Home
    </a>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-vault"></i>
                </div>
                <h1 class="login-title">EduVault</h1>
                <p class="login-subtitle">Secure Learning Platform</p>
            </div>

            <div id="message" class="message"></div>
            <div id="loadingSpinner" class="loading-spinner">
                <div class="spinner"></div>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input type="email" id="email" name="email" placeholder="student@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <div class="remember-forget">
                    <label class="remember-me">
                        <input type="checkbox" name="rememberMe">
                        Remember me
                    </label>
                    <a class="forgot-password" onclick="alert('Contact admin to reset password')">
                        Forgot password?
                    </a>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <div class="login-divider">
                Don't have an account?
            </div>

            <div class="signup-link">
                <a href="index.html#signup">Create new account</a>
                <span style="color: rgba(255,255,255,0.4);">or</span>
                <a href="index.html#signup">Register as student</a>
            </div>

            <div
                style="margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(0,212,255,0.2); text-align: center; font-size: 0.85em; color: rgba(255,255,255,0.5);">
                <div style="margin-bottom: 12px;">
                    <strong>Test Credentials:</strong>
                </div>
                <div style="margin-bottom: 8px;">
                    Admin: <code
                        style="background: rgba(0,212,255,0.1); padding: 4px 8px; border-radius: 4px;">admin@eduvault.com</code>
                </div>
                <div>
                    Student: <code
                        style="background: rgba(0,212,255,0.1); padding: 4px 8px; border-radius: 4px;">student1@eduvault.com</code>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="js/particles-config.js"></script>
    <script>
        // Configuration
        const API_BASE_URL = 'http://localhost:5000';
        // For production: const API_BASE_URL = 'https://your-render-domain.onrender.com';

        // Initialize particles
        setTimeout(() => {
            if (typeof particlesJS !== 'undefined') {
                particlesJS('particles-js', window.particlesConfig);
            }
        }, 100);

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.querySelector('input[name="rememberMe"]').checked;

            if (!email || !password) {
                showMessage('Please fill in all fields', 'error');
                return;
            }

            try {
                showLoading(true);
                showMessage('');

                const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Store token
                    const token = data.access_token;
                    const user = data.user;

                    if (rememberMe) {
                        localStorage.setItem('userToken', token);
                        localStorage.setItem('userEmail', user.email);
                        localStorage.setItem('isAdmin', user.is_admin);
                    } else {
                        sessionStorage.setItem('userToken', token);
                        sessionStorage.setItem('userEmail', user.email);
                        sessionStorage.setItem('isAdmin', user.is_admin);
                    }

                    // Also store for admin
                    if (user.is_admin) {
                        localStorage.setItem('adminToken', token);
                    }

                    showMessage(`Welcome back, ${user.name}!`, 'success');

                    // Redirect based on user type
                    setTimeout(() => {
                        if (user.is_admin) {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                    }, 1500);
                } else {
                    showMessage(data.message || 'Login failed. Please check your credentials.', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showMessage('Network error. Make sure backend is running on port 5000.', 'error');
            } finally {
                showLoading(false);
            }
        });

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;

            if (text) {
                messageDiv.classList.add('show');
            } else {
                messageDiv.classList.remove('show');
            }

            if (type === 'success') {
                setTimeout(() => {
                    messageDiv.classList.remove('show');
                }, 3000);
            }
        }

        function showLoading(show) {
            const spinner = document.getElementById('loadingSpinner');
            const btn = document.getElementById('loginBtn');

            if (show) {
                spinner.style.display = 'block';
                btn.disabled = true;
                btn.textContent = 'Logging in...';
            } else {
                spinner.style.display = 'none';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
            }
        }

        // Enter key to submit
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>

</html>
